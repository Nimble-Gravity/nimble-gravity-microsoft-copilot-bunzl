name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; cancel in-flight runs on new push
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build deploy directory (exclude internal planning docs)
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='_site' --exclude='docs' . _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Everything except docs/ (internal specs/plans — not part of the
          # live site, and some contain escape-room answer keys inline)
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
